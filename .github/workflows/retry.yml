name: OCI Capacity Retry

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Setup OCI config
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/key.pem
          EOF

      - name: Attempt apply
        run: |
          JOB=$(oci resource-manager job create-apply-job --stack-id "${{ secrets.STACK_ID }}" --execution-plan-strategy AUTO_APPROVED --query 'data.id' --raw-output)
          echo "Job created: $JOB"
          sleep 90
          STATUS=$(oci resource-manager job get --job-id "$JOB" --query 'data."lifecycle-state"' --raw-output)
          echo "Final status: $STATUS"
